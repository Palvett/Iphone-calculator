<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>iphone calculator</title>
  </head>

  <body>
    <header>
      <nav class="nav-header">
        <h1>Calculator</h1>
      </nav>
    </header>

    <div class="calculator">
      <div class="top-container">
        <div class="clock">
          <span class="hours">5</span>:<span class="minutes">40</span>
        </div>
        <div class="status">
          <img src="assets/images/status.jpeg" alt="status" />
        </div>
      </div>
      <input class="display" type="text" value="0" readonly>

      <div class="buttons-container">
        <div class="button function back">C</div>
        <div class="button function clear">AC</div>
        <div class="button function percentage">%</div>
        <div class="button operator division">÷</div>
        <div class="button number number-7">7</div>
        <div class="button number number-8">8</div>
        <div class="button number number-9">9</div>
        <div class="button operator multiplication">×</div>
        <div class="button number number-4">4</div>
        <div class="button number number-5">5</div>
        <div class="button number number-6">6</div>
        <div class="button operator subtraction">-</div>
        <div class="button number number-1">1</div>
        <div class="button number number-2">2</div>
        <div class="button number number-3">3</div>
        <div class="button operator addition">+</div>
        <div class="button function toggle">+/-</div>
        <div class="button number number-0">0</div>
        <div class="button decimal">.</div>
        <div class="button equal">=</div>
      </div>
      <div class="bottom"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
